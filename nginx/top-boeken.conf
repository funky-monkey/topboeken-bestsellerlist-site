server {
    listen *:80;
    listen [::]:80;
    server_name top-boeken.nl www.top-boeken.nl;
    return 301 https://$host$request_uri;
}

server {
    listen *:443 ssl http2;
    listen [::]:443 ssl http2;

    server_name top-boeken.nl www.top-boeken.nl;
    root /var/www/top-boeken.nl/html;
    index index.html;

    access_log /var/log/nginx/top-boeken.nl.access.log;
    error_log  /var/log/nginx/top-boeken.nl.error.log error;

    include block-rules/ssl;
    include block-rules/config;
    include block-rules/routes;
    include block-rules/letsencrypt;

    # Proxy admin panel and API — no trailing slash required
    location ~ ^/(admin|api) {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Robots-Tag      "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    ssl_certificate /etc/letsencrypt/live/top-boeken.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/top-boeken.nl/privkey.pem;
}
