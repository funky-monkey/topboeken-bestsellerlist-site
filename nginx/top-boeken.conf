server {
    listen *:80;
    listen [::]:80;
    server_name top-boeken.nl www.top-boeken.nl;
    return 301 https://$host$request_uri;
}

server {
    listen *:443 ssl http2;
    listen [::]:443 ssl http2;

    server_name top-boeken.nl www.top-boeken.nl;
    root /var/www/top-boeken.nl/html;
    index index.html;

    access_log /var/log/nginx/top-boeken.nl.access.log;
    error_log  /var/log/nginx/top-boeken.nl.error.log error;

    include block-rules/ssl;
    include block-rules/config;
    include block-rules/letsencrypt;

    # Proxy admin panel and API to Express CMS
    location ~ ^/(admin|api)/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         X-Robots-Tag      "noindex, nofollow" always;
    }

    # Static Astro pages
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Long-cache for hashed assets and cover images
    location ~* \.(js|css|woff2|woff|ico|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    ssl_certificate /etc/letsencrypt/live/top-boeken.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/top-boeken.nl/privkey.pem;
}
